<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140">
<style>
.t{transform-box:fill-box;transform-origin:center}
.tb{transform-box:fill-box;transform-origin:50% 100%}
.char{animation:tilt 3s ease-in-out infinite}
@keyframes tilt{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(-5deg) translateY(-2px)}}
.d{transform-box:fill-box;transform-origin:center;animation:dot 1.2s ease-in-out infinite}
.d2{animation-delay:.2s}.d3{animation-delay:.4s}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-3px);opacity:1}}
.bubble{transform-box:fill-box;transform-origin:0% 100%;animation:pop 2.4s ease-in-out infinite}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.ant{transform-box:fill-box;transform-origin:50% 100%}
.light{animation:glow 2s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.55}}
.light{animation:glow .6s steps(2) infinite}
</style>
<ellipse class="t shadow" cx="70" cy="128" rx="34" ry="5" fill="#000" opacity=".2"/>
<g class="tb char">
  <g class="ant">
    <path d="M70 42V24" stroke="#22314A" stroke-width="3" stroke-linecap="round"/>
    <circle class="t light" cx="70" cy="19" r="6" fill="#FFD24A" stroke="#22314A" stroke-width="3"/>
    <circle cx="68" cy="17" r="1.8" fill="#fff" opacity=".8"/>
  </g>
  <path d="M34 98Q23 102 25 110" fill="none" stroke="#22314A" stroke-width="7" stroke-linecap="round"/>
    <path d="M34 98Q23 102 25 110" fill="none" stroke="#A9C4DE" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="25" cy="111" r="5.5" fill="#A9C4DE" stroke="#22314A" stroke-width="3"/>
  <path d="M106 98Q117 102 115 110" fill="none" stroke="#22314A" stroke-width="7" stroke-linecap="round"/>
    <path d="M106 98Q117 102 115 110" fill="none" stroke="#A9C4DE" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="115" cy="111" r="5.5" fill="#A9C4DE" stroke="#22314A" stroke-width="3"/>
  <rect x="22" y="72" width="12" height="22" rx="5" fill="#A9C4DE" stroke="#22314A" stroke-width="3"/>
  <rect x="106" y="72" width="12" height="22" rx="5" fill="#A9C4DE" stroke="#22314A" stroke-width="3"/>
  <circle cx="70" cy="82" r="40" fill="#D3E5F6" stroke="#22314A" stroke-width="3"/>
  <path d="M42 70A32 32 0 0 1 64 49" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".8"/>
  <path d="M38 96A36 36 0 0 0 102 96A40 14 0 0 1 38 96Z" fill="#000" opacity=".06"/>
  <rect x="41" y="62" width="58" height="30" rx="15" fill="#1D2A3E" stroke="#22314A" stroke-width="3"/>
  <path d="M49 67H62" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".25"/>
  <ellipse cx="46" cy="101" rx="5" ry="3" fill="#FF8FA8" opacity=".55"/>
  <ellipse cx="94" cy="101" rx="5" ry="3" fill="#FF8FA8" opacity=".55"/>
  <g><rect x="55" y="67" width="10" height="11" rx="5" fill="#6FF3FF"/>
    <rect x="79" y="67" width="10" height="11" rx="5" fill="#6FF3FF"/></g>
  <path d="M66 105H76" fill="none" stroke="#22314A" stroke-width="3" stroke-linecap="round"/>
</g>
<g class="bubble">
  <circle cx="94" cy="32" r="2.5" fill="#fff" stroke="#22314A" stroke-width="2"/>
  <circle cx="100" cy="26" r="3.5" fill="#fff" stroke="#22314A" stroke-width="2"/>
  <rect x="95" y="6" width="30" height="16" rx="8" fill="#fff" stroke="#22314A" stroke-width="2.5"/>
  <circle class="d d1" cx="103" cy="14" r="2.5" fill="#22314A"/>
  <circle class="d d2" cx="110" cy="14" r="2.5" fill="#22314A"/>
  <circle class="d d3" cx="117" cy="14" r="2.5" fill="#22314A"/>
</g>
</svg>
