  <path d="M110 89Q101 91 98 97" stroke="#fff" stroke-opacity=".5" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M30 20H110A6 6 0 0 1 116 26V86L90 112H30A6 6 0 0 1 24 106V26A6 6 0 0 1 30 20Z" fill="none" stroke="#6B4F12" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="41" cy="77" rx="6.5" ry="3.8" fill="#FF8C7A" opacity=".55"/>
  <ellipse cx="99" cy="77" rx="6.5" ry="3.8" fill="#FF8C7A" opacity=".55"/>
  <g><ellipse cx="55" cy="60" rx="10.5" ry="12.5" fill="#fff" stroke="#6B4F12" stroke-width="3"/>
    <circle cx="59" cy="56" r="6" fill="#2B2113"/>
    <circle cx="57.5" cy="54" r="2" fill="#fff"/></g><g><ellipse cx="85" cy="60" rx="10.5" ry="12.5" fill="#fff" stroke="#6B4F12" stroke-width="3"/>
    <circle cx="89" cy="56" r="6" fill="#2B2113"/>
