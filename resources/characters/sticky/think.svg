  <circle cx="98" cy="26" r="3.5" fill="#fff" stroke="#6B4F12" stroke-width="2"/>
  <rect x="93" y="6" width="30" height="16" rx="8" fill="#fff" stroke="#6B4F12" stroke-width="2.5"/>
