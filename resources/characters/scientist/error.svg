<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140">
<style>
.t{transform-box:fill-box;transform-origin:center}
.tb{transform-box:fill-box;transform-origin:50% 100%}
.blink{animation:blink 4s infinite}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}97%{transform:scaleY(1)}}
.bub{transform-box:fill-box;transform-origin:center;animation:rise 1.8s ease-in infinite}
.b2{animation-delay:-.6s}.b3{animation-delay:-1.2s}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(-13px) scale(1.1);opacity:0}}
.char{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.shadow{animation:sh 3.2s ease-in-out infinite}
@keyframes sh{0%,100%{transform:scaleX(1);opacity:.2}50%{transform:scaleX(.9);opacity:.14}}
.sweat{animation:drip 1.8s ease-in -.7s infinite}
@keyframes drip{0%{transform:translateY(-3px);opacity:0}20%{opacity:1}75%{opacity:1}100%{transform:translateY(9px);opacity:0}}
</style>
