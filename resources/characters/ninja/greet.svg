<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140">
<style>
.t{transform-box:fill-box;transform-origin:center}
.tb{transform-box:fill-box;transform-origin:50% 100%}
.tails{transform-box:fill-box;transform-origin:100% 40%}
.blink{animation:blink 4s infinite}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}97%{transform:scaleY(1)}}
.char{animation:hopg 1.4s ease-in-out infinite}
@keyframes hopg{0%,30%,60%,100%{transform:translateY(0)}15%,45%{transform:translateY(-7px)}}
.shadow{animation:sh 1.4s ease-in-out infinite}
@keyframes sh{0%,30%,60%,100%{transform:scaleX(1);opacity:.2}15%,45%{transform:scaleX(.75);opacity:.1}}
.arm{transform-box:fill-box;transform-origin:0% 100%;animation:arm .7s ease-in-out infinite}
@keyframes arm{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(10deg)}}
.tails{animation:flap .45s ease-in-out infinite}
@keyframes flap{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(9deg)}}
.spin{animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sp{animation:tw 1.6s ease-in-out infinite}.s2{animation-delay:-.5s}
@keyframes tw{0%,100%{transform:scale(1) rotate(0);opacity:1}50%{transform:scale(.4) rotate(45deg);opacity:.5}}
</style>
<ellipse class="t shadow" cx="70" cy="128" rx="34" ry="5" fill="#000" opacity=".2"/>
<g class="tb char">
  <g class="tails">
    <path d="M36 55Q22 46 10 51Q18 55 35 60Z" fill="#E5484D" stroke="#1B2036" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M36 58Q24 66 17 77Q28 70 37 62Z" fill="#E5484D" stroke="#1B2036" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <circle cx="70" cy="82" r="40" fill="#2E3654" stroke="#1B2036" stroke-width="3"/>
  <path d="M54 47Q61 44 68 44" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" opacity=".3"/>
  <path d="M38 96A36 36 0 0 0 102 96A40 14 0 0 1 38 96Z" fill="#000" opacity=".15"/>
  <path d="M46 50H94A40 40 0 0 1 103.4 60H36.6A40 40 0 0 1 46 50Z" fill="#E5484D" stroke="#1B2036" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="61" y="50.5" width="18" height="9" rx="2.5" fill="#C7D2E0" stroke="#1B2036" stroke-width="2"/>
  <path d="M70 52L71.2 53.8L73 55L71.2 56.2L70 58L68.8 56.2L67 55L68.8 53.8Z" fill="#1B2036"/>
  <circle cx="37" cy="57" r="4" fill="#E5484D" stroke="#1B2036" stroke-width="2.5"/>
  <rect x="40" y="64" width="60" height="26" rx="13" fill="#FFDDBE" stroke="#1B2036" stroke-width="3"/>
  <ellipse cx="47" cy="84" rx="4" ry="2.5" fill="#FF8FA8" opacity=".6"/>
  <ellipse cx="93" cy="84" rx="4" ry="2.5" fill="#FF8FA8" opacity=".6"/>
  <path d="M51 80L57 73L63 80M77 80L83 73L89 80" fill="none" stroke="#1B2036" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M62 99Q70 100 78 99Q77 108 70 108Q63 108 62 99Z" fill="#1E2440" stroke="#4A5578" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="32" cy="104" r="7" fill="#2E3654" stroke="#1B2036" stroke-width="3"/>
  <g class="arm"><path d="M106 96Q122 92 120 74" fill="none" stroke="#1B2036" stroke-width="9" stroke-linecap="round"/>
    <path d="M106 96Q122 92 120 74" fill="none" stroke="#2E3654" stroke-width="4" stroke-linecap="round"/>
    <circle cx="120" cy="69" r="7" fill="#2E3654" stroke="#1B2036" stroke-width="3"/></g>
</g>
<g transform="translate(22 26) scale(1)"><g class="t spin">
    <path d="M0 -11L3 -3L11 0L3 3L0 11L-3 3L-11 0L-3 -3Z" fill="#C7D2E0" stroke="#1B2036" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="2.2" fill="#1B2036"/>
  </g></g>
<path class="t sp s1" d="M118 30Q118 35 123 35Q118 35 118 40Q118 35 113 35Q118 35 118 30Z" fill="#E5484D" stroke="#fff" stroke-width="1.5" style="paint-order:stroke"/>
<path class="t sp s2" d="M40 10Q40 14 44 14Q40 14 40 18Q40 14 36 14Q40 14 40 10Z" fill="#FFD24A" stroke="#fff" stroke-width="1.5" style="paint-order:stroke"/>
</svg>
