<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140">
<style>
.t{transform-box:fill-box;transform-origin:center}
.tb{transform-box:fill-box;transform-origin:50% 100%}
.tails{transform-box:fill-box;transform-origin:100% 40%}
.blink{animation:blink 4s infinite}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}97%{transform:scaleY(1)}}
.char{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.shadow{animation:sh 3.2s ease-in-out infinite}
@keyframes sh{0%,100%{transform:scaleX(1);opacity:.2}50%{transform:scaleX(.9);opacity:.14}}
.tails{animation:flap 1.6s ease-in-out infinite}
@keyframes flap{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(7deg)}}
.bulb{animation:glow 1.2s ease-in-out infinite}
@keyframes glow{0%,100%{fill:#FFE066}50%{fill:#FFF7C9}}
.rays{animation:ray 1.2s ease-in-out infinite}
@keyframes ray{0%,100%{opacity:.35}50%{opacity:1}}
.bob2{animation:bob2 1.2s ease-in-out infinite}
@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
</style>
<ellipse class="t shadow" cx="70" cy="128" rx="34" ry="5" fill="#000" opacity=".2"/>
<g class="tb char">
  <g class="tails">
    <path d="M36 55Q22 46 10 51Q18 55 35 60Z" fill="#E5484D" stroke="#1B2036" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M36 58Q24 66 17 77Q28 70 37 62Z" fill="#E5484D" stroke="#1B2036" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <circle cx="70" cy="82" r="40" fill="#2E3654" stroke="#1B2036" stroke-width="3"/>
  <path d="M54 47Q61 44 68 44" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" opacity=".3"/>
  <path d="M38 96A36 36 0 0 0 102 96A40 14 0 0 1 38 96Z" fill="#000" opacity=".15"/>
  <path d="M46 50H94A40 40 0 0 1 103.4 60H36.6A40 40 0 0 1 46 50Z" fill="#E5484D" stroke="#1B2036" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="61" y="50.5" width="18" height="9" rx="2.5" fill="#C7D2E0" stroke="#1B2036" stroke-width="2"/>
  <path d="M70 52L71.2 53.8L73 55L71.2 56.2L70 58L68.8 56.2L67 55L68.8 53.8Z" fill="#1B2036"/>
  <circle cx="37" cy="57" r="4" fill="#E5484D" stroke="#1B2036" stroke-width="2.5"/>
  <rect x="40" y="64" width="60" height="26" rx="13" fill="#FFDDBE" stroke="#1B2036" stroke-width="3"/>
  <ellipse cx="47" cy="84" rx="4" ry="2.5" fill="#FF8FA8" opacity=".6"/>
  <ellipse cx="93" cy="84" rx="4" ry="2.5" fill="#FF8FA8" opacity=".6"/>
  
  <path d="M51 70Q57 68 63 70M77 70Q83 68 89 70" fill="none" stroke="#1B2036" stroke-width="2.6" stroke-linecap="round"/>
  <g><path d="M52 80Q57 72 62 80" fill="none" stroke="#1B2036" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M78 80Q83 72 88 80" fill="none" stroke="#1B2036" stroke-width="3.2" stroke-linecap="round"/></g>
  <path d="M62 99Q70 101 78 99Q77 109 70 109Q63 109 62 99Z" fill="#1E2440" stroke="#4A5578" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="32" cy="104" r="7" fill="#2E3654" stroke="#1B2036" stroke-width="3"/>
  <circle cx="108" cy="104" r="7" fill="#2E3654" stroke="#1B2036" stroke-width="3"/>
</g>
<g class="rays" fill="none" stroke="#FFC93C" stroke-width="2.5" stroke-linecap="round">
  <path d="M20 10V6M9 15L6 12M31 15L34 12M6 25H2M34 25H38"/>
</g>
<g class="t bob2">
  <circle class="bulb" cx="20" cy="24" r="9" fill="#FFE066" stroke="#1B2036" stroke-width="2.5"/>
  <path d="M17 26L18.5 21L20 25L21.5 21L23 26" fill="none" stroke="#D99A00" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="15.5" y="32" width="9" height="6" rx="1.5" fill="#C3CBD8" stroke="#1B2036" stroke-width="2"/>
</g>
</svg>
