<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140">
<style>
.t{transform-box:fill-box;transform-origin:center}
.tb{transform-box:fill-box;transform-origin:50% 100%}
.tails{transform-box:fill-box;transform-origin:100% 40%}
.blink{animation:blink 4s infinite}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}97%{transform:scaleY(1)}}
.char{animation:tilt 3s ease-in-out infinite}
@keyframes tilt{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(-5deg) translateY(-2px)}}
.d{transform-box:fill-box;transform-origin:center;animation:dot 1.2s ease-in-out infinite}
.d2{animation-delay:.2s}.d3{animation-delay:.4s}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-3px);opacity:1}}
.bubble{transform-box:fill-box;transform-origin:0% 100%;animation:pop 2.4s ease-in-out infinite}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.tails{animation:flap 2.4s ease-in-out infinite}
@keyframes flap{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(5deg)}}
</style>
<ellipse class="t shadow" cx="70" cy="128" rx="34" ry="5" fill="#000" opacity=".2"/>
<g class="tb char">
  <g class="tails">
    <path d="M36 55Q22 46 10 51Q18 55 35 60Z" fill="#E5484D" stroke="#1B2036" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M36 58Q24 66 17 77Q28 70 37 62Z" fill="#E5484D" stroke="#1B2036" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <circle cx="70" cy="82" r="40" fill="#2E3654" stroke="#1B2036" stroke-width="3"/>
  <path d="M54 47Q61 44 68 44" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" opacity=".3"/>
  <path d="M38 96A36 36 0 0 0 102 96A40 14 0 0 1 38 96Z" fill="#000" opacity=".15"/>
  <path d="M46 50H94A40 40 0 0 1 103.4 60H36.6A40 40 0 0 1 46 50Z" fill="#E5484D" stroke="#1B2036" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="61" y="50.5" width="18" height="9" rx="2.5" fill="#C7D2E0" stroke="#1B2036" stroke-width="2"/>
  <path d="M70 52L71.2 53.8L73 55L71.2 56.2L70 58L68.8 56.2L67 55L68.8 53.8Z" fill="#1B2036"/>
  <circle cx="37" cy="57" r="4" fill="#E5484D" stroke="#1B2036" stroke-width="2.5"/>
  <rect x="40" y="64" width="60" height="26" rx="13" fill="#FFDDBE" stroke="#1B2036" stroke-width="3"/>
  <ellipse cx="47" cy="84" rx="4" ry="2.5" fill="#FF8FA8" opacity=".6"/>
  <ellipse cx="93" cy="84" rx="4" ry="2.5" fill="#FF8FA8" opacity=".6"/>
  <path d="M52 69L61 68M79 68L88 69" stroke="#1B2036" stroke-width="2.5" stroke-linecap="round"/>
  <g>
    <ellipse cx="60" cy="76" rx="4" ry="5" fill="#1B2036"/>
    <ellipse cx="85" cy="76" rx="4" ry="5" fill="#1B2036"/>
    <circle cx="61.5" cy="74" r="1.5" fill="#fff"/>
    <circle cx="86.5" cy="74" r="1.5" fill="#fff"/>
  </g>
  <path d="M66 102H74" stroke="#4A5578" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="104" r="7" fill="#2E3654" stroke="#1B2036" stroke-width="3"/>
  <circle cx="86" cy="110" r="7" fill="#2E3654" stroke="#1B2036" stroke-width="3"/>
</g>
<g class="bubble">
  <circle cx="94" cy="32" r="2.5" fill="#fff" stroke="#1B2036" stroke-width="2"/>
  <circle cx="100" cy="26" r="3.5" fill="#fff" stroke="#1B2036" stroke-width="2"/>
  <rect x="95" y="6" width="30" height="16" rx="8" fill="#fff" stroke="#1B2036" stroke-width="2.5"/>
  <circle class="d d1" cx="103" cy="14" r="2.5" fill="#1B2036"/>
  <circle class="d d2" cx="110" cy="14" r="2.5" fill="#1B2036"/>
  <circle class="d d3" cx="117" cy="14" r="2.5" fill="#1B2036"/>
</g>
</svg>
